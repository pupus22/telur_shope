<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Login · Shopee Payout Manager</title>
  <link rel="stylesheet" href="./styles-2.1.4.css">
</head>
<body>
  <section class="auth-gate">
    <form id="loginForm" class="login-card" novalidate>
      <div class="brand-mark">SP</div>
      <h1>Shopee Payout Manager</h1>
      <p>Login Admin · halaman Auth terpisah dari aplikasi.</p>
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button id="loginBtn" class="btn primary wide" type="submit">Login</button>
      <div id="loginMessage" class="message info">Memuat Firebase Authentication...</div>
      <small style="display:block;margin-top:10px;color:#64748b">v2.1.4 · Auth terisolasi · Firestore tidak digunakan di halaman ini</small>
    </form>
  </section>
  <script type="module" src="./login-2.1.4.js"></script>
</body>
</html>
